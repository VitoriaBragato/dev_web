<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ativade-Drop-Down</title>
    <link rel="stylesheet" href="css/reset.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a herf="#"> Início</a></li>
                <li><a herf="#">  Produto</a>
                <ul>
                    <li><a href="#">Notebook</a></li>
                    <li><a href="#">Smartphone</a></li>
                    <li><a href="#">Acessórios</a></li>
                    <li><a href="#">Ofertas</a></li>
                </ul>
                </li>
                <li ><a herf="#"> Serviço</a>
                <ul>
                    <li><a href="#">Conserto</a></li>
                    <li><a href="#">Venda</a></li>
                    <li><a href="#">Troca</a></li>
                    <li><a href="#">Reserva</a></li>
                </ul>
                </li>
                <li><a herf="#"> Sobre</a></li>
                <li><a herf="#"> Contato</a></li>
            </ul>
        </nav>
    </header>

    <style>
        *{
            margin: 0;
            padding: 0;
            list-style: none;
            color: inherit;
            box-sizing: border-box;
            text-decoration:  none;
        }

        header nav>ul {
            display: flex;
            justify-content: space-around;
        }
        header nav ul li ul{
             /* display: none; --- esconder os elementos da ul2 */
            visibility: hidden;
            opacity: 0;
            position: absolute;/* não mover os outros elementos*/
            transition: opacity 0.5s;
        }
         header nav ul li:hover ul{
            /*display: block;*/
            visibility: visible;
            opacity: 1; 
        }

        header nav ul{ 
            margin: 0.2rem;
            border-radius: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            background-color: rgb(14, 14, 31);
        }
        header nav ul li{
             padding: 30px;
        }
        header nav ul li:hover{
            border-radius: 13px;
            color: white;
             padding: 30px;
             background-color: rgb(51, 94, 173);
        }

        header nav ul li ul{
            padding: 20px;
            font-size: medium;
            color: black;
            background-color: rgb(224, 222, 222);
        }
         header nav ul li ul li{
            border-radius: 20px;
    
        }
        



    </style>
</body>
</html>
